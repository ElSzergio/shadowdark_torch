; Shadowdark Torch — M5Stack CoreS3
; ---------------------------------
; A one-hour real-time torch for Shadowdark RPG.
;   * Light it by shaking the device (BMI270 accelerometer)
;   * Blow it out over the microphone (ES7210), or let it burn down
;   * A screen tap arms/disarms the blow detector (dark-table mode)

[env:m5stack-cores3]
platform  = espressif32@^6.10.0
board     = m5stack-cores3      ; already sets PSRAM, 16MB partitions and USB-CDC
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_deps =
    m5stack/M5Unified@^0.2.2
